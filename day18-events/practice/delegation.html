<!DOCTYPE html>
<!--
  DAY 18 · practice/delegation.html · One listener for a whole list
  ============================================================
  Click a lesson to mark it done; click × to delete it; add new lessons.
  All clicks are handled by ONE listener on the <ul>: that's event delegation.
  New lessons work straight away, with no extra listeners. Script: delegation.js
-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 18 · Event delegation</title>
    <style>
      body { margin: 0; padding: 2rem 1rem; font-family: system-ui, Arial, sans-serif; line-height: 1.6; color: #1b2330; background: #f4f6f8; }
      main { max-width: 36rem; margin: 0 auto; padding: 1.5rem; border: 1px solid #dde2e8; border-radius: 0.75rem; background: #fff; }
      ul { display: grid; gap: 0.5rem; margin: 1rem 0; padding: 0; list-style: none; }
      li { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.4rem 0.4rem 0.8rem; border: 1px solid #dde2e8; border-radius: 0.5rem; }
      li.done .lesson { color: #5b6573; text-decoration: line-through; }
      .lesson { flex: 1; padding: 0.2rem 0; border: 0; font: inherit; text-align: left; background: none; cursor: pointer; }
      .delete { width: 2rem; height: 2rem; border: 0; border-radius: 999px; font-size: 1.2rem; background: none; cursor: pointer; }
      .delete:hover { color: #b42318; background: #fdf1e7; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.4rem 0.6rem; border: 1px solid #b8c0cc; border-radius: 0.4rem; font: inherit; }
      form button { padding: 0.4rem 1rem; border: 0; border-radius: 999px; font: inherit; font-weight: 700; color: #fff; background: #1f7a55; cursor: pointer; }
      .log { margin: 0; font: 0.85rem/1.5 Consolas, monospace; color: #5b6573; }
    </style>
  </head>
  <body>
    <main>
      <h1>This week's lessons</h1>
      <ul id="lessons">
        <li><button class="lesson" type="button">Arrays and array methods</button><button class="delete" type="button" aria-label="Delete">×</button></li>
        <li><button class="lesson" type="button">Objects and JSON</button><button class="delete" type="button" aria-label="Delete">×</button></li>
        <li><button class="lesson" type="button">The DOM</button><button class="delete" type="button" aria-label="Delete">×</button></li>
      </ul>
      <form id="lesson-form">
        <input id="lesson-input" aria-label="New lesson" placeholder="Add a lesson" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <p class="log" id="log" aria-live="polite">Click a lesson or a ×.</p>
    </main>
    <script src="delegation.js" defer></script>
  </body>
</html>
