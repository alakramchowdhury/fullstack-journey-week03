<!DOCTYPE html>
<!--
  DAY 19 · practice/theme.html · Remember a choice with localStorage
  ============================================================
  Pick a theme, reload the page (F5): your choice is still there.
  DevTools → Application → Local Storage shows the saved key and value.
  Script: theme.js. Open with Live Server.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 19 · Saved theme</title>
    <style>
      body { margin: 0; padding: 2rem 1rem; font-family: system-ui, Arial, sans-serif; line-height: 1.6; color: #1b2330; background: #f4f6f8; transition: background 0.2s; }
      main { max-width: 36rem; margin: 0 auto; padding: 1.5rem; border: 1px solid #dde2e8; border-radius: 0.75rem; background: #fff; }
      .row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 1rem 0; }
      button { padding: 0.4rem 1rem; border: 2px solid #1f7a55; border-radius: 999px; font: inherit; font-weight: 700; color: #1f7a55; background: transparent; cursor: pointer; }
      button[aria-pressed="true"] { color: #fff; background: #1f7a55; }
      code { padding: 0 0.3rem; border-radius: 4px; background: #eaf3ee; }
      .saved { font-family: Consolas, monospace; }
      /* The whole theme is one attribute on <html> */
      html[data-theme="dark"] body { color: #e6eaef; background: #0d1117; }
      html[data-theme="dark"] main { border-color: #2d333b; background: #161b22; }
      html[data-theme="dark"] code { background: #2d333b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pick a theme</h1>
      <p>Then reload the page. The choice is saved in <code>localStorage</code>.</p>
      <div class="row" id="theme-buttons" role="group" aria-label="Theme">
        <button type="button" data-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
      </div>
      <p class="saved" id="saved"></p>
      <button type="button" id="forget">Forget my choice</button>
    </main>
    <script src="theme.js" defer></script>
  </body>
</html>
